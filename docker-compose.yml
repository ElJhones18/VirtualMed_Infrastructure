version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: vm_postgres
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  minio:
    image: minio/minio
    container_name: vm_minio
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data

  chromadb:
    image: chromadb/chroma
    container_name: vm_chromadb
    ports:
      - "${CHROMA_PORT}:8000"

  backend:
    build:
      context: ../VirtualMedBackend
      dockerfile: dockerfile
    container_name: vm_backend
    env_file: .env
    depends_on:
      - postgres
    ports:
      - "${BACKEND_PORT}:8080"

  ai-service:
    build:
      context: ../ai-service
      dockerfile: dockerfile
    container_name: vm_ai
    env_file: .env
    depends_on:
      - chromadb
    ports:
      - "${AI_SERVICE_PORT}:8000"

  frontend:
    build:
      context: ../VirtualMed_Frontend
      dockerfile: dockerfile
    container_name: vm_frontend
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8080
      - NEXT_PUBLIC_AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:3000"

  nginx:
    image: nginx:latest
    container_name: vm_nginx
    depends_on:
      - frontend
      - backend
      - ai-service
    ports:
      - "${NGINX_PORT}:80"
      - "${NGINX_SSL_PORT}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/nginx/certs

volumes:
  postgres_data:
  minio_data: